[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baboons-demo-forge"
version = "0.1.0"
description = "MCP server that deploys speculative client demos to *.baboons.dev"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastmcp>=2.10.0",
    "pydantic>=2.9.0",
    "starlette>=0.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
