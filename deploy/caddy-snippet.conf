# =============================================================================
# Baboons Demo Forge — Caddy snippet
# =============================================================================
# Add these blocks to /etc/caddy/Caddyfile.
#
# Prerequisites:
#   - Caddy build includes the cloudflare DNS plugin
#       (xcaddy build --with github.com/caddy-dns/cloudflare)
#   - CLOUDFLARE_API_TOKEN is exported in /etc/default/caddy (or wherever
#     Caddy reads its env). The token must have:
#       - Zone / Zone / Read    on baboons.dev
#       - Zone / DNS / Edit     on baboons.dev
#
# More-specific site blocks (e.g. forge.baboons.dev, sales.baboons.dev,
# stax.baboons.dev) win over the wildcard, so they keep working unchanged.

# -----------------------------------------------------------------------------
# Forge MCP server + centralized client asset hosting
# -----------------------------------------------------------------------------
# /assets/* is split so that:
#   - GETs for a specific file are served by Caddy's file_server directly
#     from /var/www/demos/.assets/, with an immutable Cache-Control header
#     and a CSP that neuters any embedded JS (SVGs can contain <script>).
#   - POST/DELETE (mutations) AND GET on /assets/<client>/ (listing,
#     trailing slash) go to the Python app, which checks the bearer
#     and validates input.
#   - Everything else (MCP, /health, OAuth) hits the Python app.
#
# `handle` blocks are exclusive: the most specific match wins. The two
# named-matcher handles come before `handle_path /assets/*` because they
# carry method matchers that the bare path handle can't express.
forge.baboons.dev {
	tls {
		dns cloudflare {env.CLOUDFLARE_API_TOKEN}
	}
	encode zstd gzip

	@assets_to_app {
		path /assets/*
		not method GET HEAD
	}
	@assets_listing {
		path_regexp ^/assets/[^/]+/$
		method GET
	}
	handle @assets_to_app {
		reverse_proxy 127.0.0.1:8090
	}
	handle @assets_listing {
		reverse_proxy 127.0.0.1:8090
	}

	# Caddy serves stored assets directly. `handle_path` strips the
	# `/assets/` prefix so the URL maps onto /var/www/demos/.assets/.
	handle_path /assets/* {
		root * /var/www/demos/.assets
		file_server
		header Cache-Control "public, max-age=31536000, immutable"
		# SVGs can carry <script>. We host on the same origin as /mcp,
		# /authorize, /token — so JS in an asset would be in-origin.
		# Disable script execution and sandbox the document.
		header Content-Security-Policy "script-src 'none'; sandbox"
		# Prevent the browser/Caddy from second-guessing the declared MIME.
		header X-Content-Type-Options "nosniff"
	}

	handle {
		reverse_proxy 127.0.0.1:8090
	}
}

# -----------------------------------------------------------------------------
# Wildcard demo host: <slug>.baboons.dev → /var/www/demos/<slug>/
# -----------------------------------------------------------------------------
*.baboons.dev {
	tls {
		dns cloudflare {env.CLOUDFLARE_API_TOKEN}
	}
	encode zstd gzip

	# {labels.2} is the leftmost subdomain (labels are RTL: 0=dev, 1=baboons, 2=*).
	root * /var/www/demos/{labels.2}
	file_server

	handle_errors {
		@notfound expression `{err.status_code} == 404`
		respond @notfound "Demo not found." 404
	}
}
