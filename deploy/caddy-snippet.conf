# =============================================================================
# Baboons Demo Forge — Caddy snippet
# =============================================================================
# Add these blocks to /etc/caddy/Caddyfile.
#
# Prerequisites:
#   - Caddy build includes the cloudflare DNS plugin
#       (xcaddy build --with github.com/caddy-dns/cloudflare)
#   - CLOUDFLARE_API_TOKEN is exported in /etc/default/caddy (or wherever
#     Caddy reads its env). The token must have:
#       - Zone / Zone / Read    on baboons.dev
#       - Zone / DNS / Edit     on baboons.dev
#
# More-specific site blocks (e.g. forge.baboons.dev, sales.baboons.dev,
# stax.baboons.dev) win over the wildcard, so they keep working unchanged.

# -----------------------------------------------------------------------------
# Forge MCP server
# -----------------------------------------------------------------------------
forge.baboons.dev {
	tls {
		dns cloudflare {env.CLOUDFLARE_API_TOKEN}
	}
	encode zstd gzip
	reverse_proxy 127.0.0.1:8090
}

# -----------------------------------------------------------------------------
# Wildcard demo host: <slug>.baboons.dev → /var/www/demos/<slug>/
# -----------------------------------------------------------------------------
*.baboons.dev {
	tls {
		dns cloudflare {env.CLOUDFLARE_API_TOKEN}
	}
	encode zstd gzip

	# {labels.2} is the leftmost subdomain (labels are RTL: 0=dev, 1=baboons, 2=*).
	root * /var/www/demos/{labels.2}
	file_server

	handle_errors {
		@notfound expression `{err.status_code} == 404`
		respond @notfound "Demo not found." 404
	}
}
